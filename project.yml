name: Cue
options:
  bundleIdPrefix: com.san
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  Cue:
    type: application
    platform: macOS
    sources:
      - path: Cue
        excludes:
          - Info.plist
          - Cue-Debug.entitlements
    dependencies:
      - package: Sparkle
    scheme:
      testTargets:
        - CueTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.san.Cue
        # Sparkle's feed and key; Xcode merges the generated keys into this file.
        INFOPLIST_FILE: Cue/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cue/Cue.entitlements
        PRODUCT_NAME: Offscript
        PRODUCT_MODULE_NAME: Cue
        INFOPLIST_KEY_CFBundleDisplayName: Offscript
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: "Made by santiagoalonso.com"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Offscript listens to your voice to auto-scroll the teleprompter and help you rehearse."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Offscript transcribes what you read so it can scroll the teleprompter to your exact position in the script."
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        # No Dock icon: Offscript lives in the menu bar so it stays out of screen shares
        INFOPLIST_KEY_LSUIElement: YES
      configs:
        # Debug adds read-write access to test-audio/ for audio test runs
        Debug:
          CODE_SIGN_ENTITLEMENTS: Cue/Cue-Debug.entitlements

  # Logic tests for script following and saved scripts. They compile those files directly, so
  # they run without launching the sandboxed app.
  CueTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CueTests
      - path: Cue/Services/TranscriptionMatcher.swift
      - path: Cue/Services/Logger.swift
      - path: Cue/Services/ScriptLibrary.swift
      - path: Cue/Services/PracticeScript.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.san.CueTests
        GENERATE_INFOPLIST_FILE: YES
